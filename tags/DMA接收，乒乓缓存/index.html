  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 等待 mermaid 加载完成
      function waitForMermaid(callback) {
        if (typeof mermaid !== 'undefined') {
          callback();
        } else {
          setTimeout(function() { waitForMermaid(callback); }, 100);
        }
      }
      
      waitForMermaid(function() {
        // 查找所有 Mermaid 代码块（多种可能的选择器）
        var selectors = [
          'pre code.language-mermaid',
          'pre .mermaid',
          '.highlight .mermaid',
          'pre[data-lang="mermaid"] code'
        ];
        
        var elements = [];
        selectors.forEach(function(sel) {
          var found = document.querySelectorAll(sel);
          found.forEach(function(el) {
            elements.push(el);
          });
        });
        
        // 去重
        var uniqueElements = [];
        elements.forEach(function(el) {
          if (uniqueElements.indexOf(el) === -1) {
            uniqueElements.push(el);
          }
        });
        
        if (uniqueElements.length === 0) return;
        
        // 替换代码块为 mermaid 容器
        uniqueElements.forEach(function(element) {
          var pre = element.closest('pre');
          if (!pre) return;
          
          var code = element.textContent || element.innerText;
          
          var container = document.createElement('div');
          container.className = 'mermaid';
          container.textContent = code;
          
          pre.parentNode.replaceChild(container, pre);
        });
        
        // 初始化并渲染
        mermaid.initialize({
          startOnLoad: false,
          theme: 'default'
        });
        
        mermaid.run();
      });
    });
  </script>
